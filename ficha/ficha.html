<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campanha</title>

    <link rel="stylesheet" type="text/css" href="css/main.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div id="ficha-container">

<form id="ficha">

    <input type="hidden" id="input">

    <!-- nome do jogador -->
    <input type="text" id="nome" name="nome_jogador" placeholder="Nome do Jogador" maxlength="50">
    <br><br>

    <!-- vida do jogador -->
    <label for="vida">Vida:</label>
    <select id="vida" name="vida">
        <option value="0">0/6</option>
        <option value="1">1/6</option>
        <option value="2">2/6</option>
        <option value="3">3/6</option>
        <option value="4">4/6</option>
        <option value="5">5/6</option>
        <option value="6">6/6</option>
    </select>
    <br><br>


    <!-- dados do jogador -->
    <label for="dados">Dados:</label>
    <select id="dados" name="dados">
        <option value="0">0/6</option>
        <option value="1">1/6</option>
        <option value="2">2/6</option>
        <option value="3">3/6</option>
        <option value="4">4/6</option>
        <option value="5">5/6</option>
        <option value="6">6/6</option>
    </select>
    <br><br>


    <!-- arquetipos -->
    <label for="arquetipo">Arquétipos:</label>
    <select id="arquetipo" name="arquetipo">
        <option value="0">Arquétipo</option>
        <option value="1">Atleta</option>
        <option value="2">Cético</option>
        <option value="3">Esbelto</option>
        <option value="4">Herói</option>
        <option value="5">Inocente</option>
        <option value="6">Nerd</option>
        <option value="7">Relaxado</option>
        <option value="8">Valentão</option>
    </select>
    <br><br><br>

    <!-- atributos -->
    <label>Atributos Especialista:</label>
    <br><br>
    <label>Carisma:</label><input type="number" class="atributos" id="carisma"><br><br>

    <label>Destreza:</label><input type="number" class="atributos" id="destreza"><br><br>

    <label>Força:</label><input type="number" class="atributos" id="força"><br><br>

    <label>Inteligência:</label><input type="number" class="atributos" id="inteligencia"><br><br>

    <label>Vigor:</label><input type="number" class="atributos" id="vigor"><br><br>
    <br><br>


    <!-- habilidades do jogador -->
    <textarea type="text" class="habilidade" placeholder="Primeira habilidade" required></textarea>
    <textarea type="text" class="habilidade" placeholder="Segunda habilidade" required></textarea>

    
    
    <!-- Botão de nova ficha -->
    <button type="submit" id="botao" onclick="novaCampanha()"><b>Salvar ficha</b></button>

</form>

    <!-- registro de fichas -->
    <p id="p">Fichas registradas:</p>
    <div id="lista">Carregando...</div>

</div>

    <script src="js/ficha.js"></script>

</body>
</html>
