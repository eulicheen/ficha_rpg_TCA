<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campanha</title>

    <link rel="stylesheet" type="text/css" href="css/main.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<form clas="oculto">

    <!-- nome do jogador -->
    <input type="text" id="nome" placeholder="Nome do jogador">

    <!-- vida do jogador -->
    <input type="number" id="vida" placeholder="Vida" required>

    <!-- dados do jogador -->
    <input type="number" id="dados" placeholder="Dados" required>

    <!-- habilidades do jogador -->
    <input type="text" id="habilidade1" placeholder="Primeira habilidade" required>
    <input type="text" id="habilidade2" placeholder="Segunda habilidade" required>
    
    <!-- Botão de nova ficha -->
    <button type="submit" id="botao" onclick="novaCampanha()"><b>Criar ficha</b></button>

</form>

    <p id="p">Fichas registradas:</p>
    <div id="lista">Carregando...</div>

    <script src="js/criar_campanha.js"></script>

</body>
</html>
